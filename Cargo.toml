[package]
name = "atcoder-submissions-backend"
version = "0.1.0"
edition = "2021"
authors = ["magurofly <54321436+magurofly@users.noreply.github.com>"]

[lib]
crate-type = ["cdylib"]

[dependencies]
async-compression = { version = "0.4.42", features = ["gzip", "tokio"] }
bytes = "1.11.1"
csv-async = { version = "1.3.1", features = ["tokio"] }
futures-core = "0.3.32"
hex = "0.4.3"
itertools = "0.14.0"
regex = "1.12.3"
serde = "1.0.228"
tokio-stream = "0.1.18"
tokio-util = { version = "0.7.18", features = ["io"] }
wasm-bindgen = "0.2.121"
worker = { version = "0.8.3", features = ["d1"] }
worker-macros = { version = "0.8.3" }
